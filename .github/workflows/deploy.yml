name: Deploy Hanamaru to UZERO
on:
  # Temporarily manual-only until SSH secrets and successful smoke tests are verified.
  # Restore main push trigger after the first confirmed deployment.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hanamaru-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax validation
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-curl
          find public app -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find ops -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "DEPLOY_SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=$SSH_USER@$SSH_HOST" >> "$GITHUB_ENV"
      - name: Deploy with preflight, SQLite backup and rollback
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$DEPLOY_TARGET" \
            "bash /var/www/hanamaru/ops/deploy.sh $DEPLOY_SHA"
