name: PHP syntax and static checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql php-mbstring
      - name: PHP syntax check
        run: |
          find public app -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Shell syntax check
        run: |
          find ops -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Verify no secrets are tracked
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|.*\.sqlite|.*\.sqlite-wal|.*\.sqlite-shm)$'
