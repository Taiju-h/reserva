name: PHP and JavaScript syntax
on:
  push:
    branches: [main]
    paths:
      - "app/**/*.php"
      - "ops/**/*.php"
      - "public/**/*.php"
      - "public/assets/**/*.js"
      - ".github/workflows/teacher-profile-lint.yml"
  pull_request:
    paths:
      - "app/**/*.php"
      - "ops/**/*.php"
      - "public/**/*.php"
      - "public/assets/**/*.js"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -v
          find app ops public -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Corporate schedule regression tests
        run: php tests/corporate-policy-test.php
      - name: Corporate email verification regression tests
        run: php tests/corporate-email-test.php
      - name: JavaScript syntax
        run: |
          node -v
          find public/assets -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
