services:
  hanamaru:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./:/var/www/html:ro
      - ./storage:/var/www/html/storage:rw
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(extension_loaded(\"pdo_sqlite\") && extension_loaded(\"sqlite3\") && extension_loaded(\"mbstring\") && extension_loaded(\"curl\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
